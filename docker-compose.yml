version: '3.9'
services:
  server:
    build: ./Server
    ports:
      - '5000:5000'
    env_file: ./Server/.env
    depends_on: []
    volumes:
      - ./Server:/app
      - /app/node_modules

  client:
    build: ./Client
    ports:
      - '5173:5173'
    env_file: ./Client/.env.local
    volumes:
      - ./Client:/app
      - /app/node_modules
    depends_on:
      - server
